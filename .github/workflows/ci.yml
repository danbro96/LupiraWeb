name: CI

on:
  pull_request:
  push:
    branches-ignore:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    uses: ./.github/workflows/tests.yml
    with:
      run_integration: ${{ contains(github.event.pull_request.labels.*.name, 'integration') }}

  contract-drift:
    name: OpenAPI contract drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Regenerate spec
        run: dotnet build src/LupiraWeb.Server/LupiraWeb.Server.csproj -c Release
      - name: Diff public spec
        run: |
          if ! git diff --exit-code -- lupiraweb.client/backend-openapi.json; then
            echo "::error::lupiraweb.client/backend-openapi.json is out of date. Run 'dotnet build src/LupiraWeb.Server' and commit the regenerated spec."
            exit 1
          fi

  client-drift:
    name: Orval client drift
    needs: contract-drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Regenerate spec
        run: dotnet build src/LupiraWeb.Server/LupiraWeb.Server.csproj -c Release
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: lupiraweb.client/package-lock.json
      - name: Regenerate + diff API client
        working-directory: lupiraweb.client
        run: |
          npm ci
          npm run generate:api
          if ! git diff --exit-code -- src/api/lupiraWebServerApi.ts src/api/models; then
            echo "::error::Generated API client is out of date. Run 'npm run generate:api' and commit the result."
            exit 1
          fi

  frontend-test:
    name: Frontend test (Vitest + lint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lupiraweb.client
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: lupiraweb.client/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
