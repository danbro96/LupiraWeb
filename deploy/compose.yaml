# Reference Compose for LupiraWeb (public) — backend (.NET read-only API) + frontend (Next.js).
# Every host, port, and URL below is an overridable ${VAR:-default} sample from the maintainer's
# deployment — override them for your environment (see .env.example). Values marked :?required must be set.
services:
  backend:
    image: danbro96/lupiraweb-backend:${IMAGE_TAG:-latest}
    container_name: lupira-backend
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:80
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL:-http/protobuf}
      OTEL_METRIC_EXPORT_INTERVAL: ${OTEL_METRIC_EXPORT_INTERVAL:-300000}
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
      OTEL_RESOURCE_ATTRIBUTES: ${OTEL_RESOURCE_ATTRIBUTES:-deployment.environment=prod,host.name=medelynas}
      # Career/résumé data source — CareerApi's public read surface at /public/{handle}/…
      # This stack holds no database; CareerApi owns the event store.
      CareerApi__BaseUrl: ${CAREERAPI_BASE_URL:?CAREERAPI_BASE_URL is required}
      CareerApi__PublicHandle: ${CAREERAPI_PUBLIC_HANDLE:-danbro}
      # Machine token minted from Authentik (client_credentials): sub = lupira-web-svc, aud = lupira-career.
      CareerApi__Auth__TokenEndpoint: ${CAREERAPI_TOKEN_ENDPOINT:-https://auth.lupira.com/application/o/token/}
      CareerApi__Auth__ClientId: ${CAREERAPI_CLIENT_ID:-lupira-web}
      CareerApi__Auth__ClientSecret: ${CAREERAPI_CLIENT_SECRET:?CAREERAPI_CLIENT_SECRET is required}
      CareerApi__Auth__ServiceAccountUsername: ${CAREERAPI_SVC_USERNAME:-lupira-web-svc}
      CareerApi__Auth__ServiceAccountToken: ${CAREERAPI_SVC_TOKEN:?CAREERAPI_SVC_TOKEN is required}
      CareerApi__Auth__Scope: ${CAREERAPI_SCOPE:-openid lupira-career-aud}
      Demos__Chat__BaseUrl: ${DEMOS_CHAT_BASE_URL:?DEMOS_CHAT_BASE_URL is required}
      Demos__Chat__ApiKey: ${DEMOS_CHAT_API_KEY:-}
      Demos__TextToSpeech__BaseUrl: ${DEMOS_TTS_BASE_URL:?DEMOS_TTS_BASE_URL is required}
      Demos__TextToSpeech__ApiKey: ${DEMOS_TTS_API_KEY:-}
      Demos__Vision__BaseUrl: ${DEMOS_VISION_BASE_URL:?DEMOS_VISION_BASE_URL is required}
      Demos__Vision__ApiKey: ${DEMOS_VISION_API_KEY:-}
    ports:
      - "${BACKEND_PORT:-40081}:80"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:80/readyz || exit 1"]
      interval: 60s
      timeout: 3s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    networks:
      - medelynas_data
      - medelynas_telemetry
      - lupira_web

  frontend:
    image: danbro96/lupiraweb-frontend:${IMAGE_TAG:-latest}
    container_name: lupira-frontend
    environment:
      API_BASE_URL: http://backend:80
    ports:
      - "${FRONTEND_PORT:-40080}:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - lupira_web

networks:
  medelynas_data:
    external: true
    name: medelynas_data
  medelynas_telemetry:
    external: true
    name: medelynas_telemetry
  lupira_web:
    driver: bridge
