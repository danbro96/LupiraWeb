# Local development stack. Pairs with docker-compose.override.yml for live frontend.
# The backend is a stateless BFF over LupiraCareerApi (run it separately) — no database.
# Production on TrueNAS uses the stack under deploy/, not this file.
services:
  backend:
    image: danbro96/lupiraweb-backend:latest
    container_name: backend
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      CareerApi__BaseUrl: ${CAREERAPI_BASE_URL:-http://host.docker.internal:63063}
      CareerApi__Auth__Token: ${CAREERAPI_AUTH_TOKEN:-}
    ports:
      - "8080:80"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:80/readyz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  frontend:
    image: danbro96/lupiraweb-frontend:latest
    container_name: frontend
    environment:
      API_BASE_URL: http://backend:80
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped
