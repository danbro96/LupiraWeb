# Local development stack. Pairs with docker-compose.override.yml for live frontend.
# The backend is a stateless BFF over LupiraCareerApi (run it separately) — no database.
# Production on TrueNAS uses the stack under deploy/, not this file.
services:
  backend:
    image: danbro96/lupiraweb-backend:latest
    container_name: backend
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      CareerApi__BaseUrl: ${CAREERAPI_BASE_URL:-http://host.docker.internal:63063}
      CareerApi__PublicHandle: ${CAREERAPI_PUBLIC_HANDLE:-danbro}
      CareerApi__Auth__TokenEndpoint: ${CAREERAPI_TOKEN_ENDPOINT:-https://auth.lupira.com/application/o/token/}
      CareerApi__Auth__ClientId: ${CAREERAPI_CLIENT_ID:-lupira-web}
      CareerApi__Auth__ClientSecret: ${CAREERAPI_CLIENT_SECRET:-}
      CareerApi__Auth__ServiceAccountUsername: ${CAREERAPI_SVC_USERNAME:-lupira-web-svc}
      CareerApi__Auth__ServiceAccountToken: ${CAREERAPI_SVC_TOKEN:-}
      CareerApi__Auth__Scope: ${CAREERAPI_SCOPE:-openid lupira-career-aud}
    ports:
      - "8080:80"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:80/readyz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  frontend:
    image: danbro96/lupiraweb-frontend:latest
    container_name: frontend
    environment:
      API_BASE_URL: http://backend:80
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped
